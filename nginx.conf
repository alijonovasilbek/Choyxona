
user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    client_max_body_size 1000M;

    # ================= HTTPS (443 in container, 8443 on host) =================
    # Port 80/443 on the host belong to another project's nginx.
    # Cert issuance/renewal is done host-side via certbot standalone.
    server {
        listen 443 ssl;
        server_name choyxona.api.cognilabs.org;

        ssl_certificate     /etc/letsencrypt/live/choyxona.api.cognilabs.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/choyxona.api.cognilabs.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://web:8008;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
