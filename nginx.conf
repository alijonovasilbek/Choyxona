
user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    client_max_body_size 1000M;

    # ================= HTTP (80) =================
    server {
        listen 80;
        server_name choyxona.api.cognilabs.org;

        # Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Everything else → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ================= HTTPS (443) =================
    server {
        listen 443 ssl;
        server_name choyxona.api.cognilabs.org;

        ssl_certificate     /etc/letsencrypt/live/choyxona.api.cognilabs.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/choyxona.api.cognilabs.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://web:8008;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
