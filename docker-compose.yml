version: "3.9"

services:
  db:
    image: postgres:15                                    #docker-compose.yml
    container_name: choyxona_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-2222}
      POSTGRES_DB: ${DB_NAME:-choyxona_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./certbot/www:/var/www/certbot
    networks:
      - choyxona_net
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-choyxona_db}"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: web
    command: uvicorn run:app --host 0.0.0.0 --port 8008
    volumes:
      - .:/app
    ports:
      - "8008:8008"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - choyxona_net

  nginx:
    image: nginx:latest
    container_name: choyxona_nginx
    restart: always
    ports:
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    networks:
      - choyxona_net



volumes:
  postgres_data:

networks:
  choyxona_net:
    driver: bridge
