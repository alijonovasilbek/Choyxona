version: "3.9"

services:
  db:
    image: postgres:15                                    #docker-compose.yml
    container_name: choyxona_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - choyxona_net

  web:
    build: .
    container_name: web
    command: uvicorn main:app --host 0.0.0.0 --port 8008
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - choyxona_net

  nginx:
    image: nginx:latest
    container_name: choyxona_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      - web
    networks:
      - choyxona_net

volumes:
  postgres_data:

networks:
  choyxona_net:
    driver: bridge
