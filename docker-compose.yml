version: "3.9"

services:
  db:
    image: postgres:15                                    #docker-compose.yml
    container_name: choyxona_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2222"
      POSTGRES_DB: choyxona_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./certbot/www:/var/www/certbot
    networks:
      - choyxona_net
    env_file:
      - .env

  web:
    build: .
    container_name: web
    command: uvicorn run:app --host 0.0.0.0 --port 8008
    volumes:
      - .:/app
    ports:
      - "8008:8008"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - choyxona_net

  nginx:
    image: nginx:latest
    container_name: choyxona_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web
    networks:
      - choyxona_net
  certbot:
    image: certbot/certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot



volumes:
  postgres_data:

networks:
  choyxona_net:
    driver: bridge
